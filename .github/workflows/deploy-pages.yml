name: Deploy GitHub Pages

# website6.0 部署骨架 v1（开发运维产出，基于 website5.0 deploy-pages.yml 改造）
# 归属仓库：longzhengyun/website6.0 → .github/workflows/deploy-pages.yml
# 与 5.0 差异：SITE_URL 改为仓库 Variable 可切换（M4 路径地址 → M5 换绑后改 www.jary8.com）、
# 新增类型检查步骤与产物密钥痕迹 grep 门禁（后端红线 1/3）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://longzhengyun.github.io/website6.0/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint, P-4 gate)
        run: npm run lint

      - name: Type & content check (Astro check)
        run: npm run check --if-present

      - name: Build site
        run: npm run build

      - name: QA gates G2-G5 (test baseline §2.1)
        run: node scripts/qa-gates.mjs

      - name: Verify CNAME and place it in artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f public/CNAME || { echo "::error::public/CNAME missing (frontend owns this file)"; exit 1; }
          [ "$(tr -d '\r\n' < public/CNAME)" = "www.jary8.com" ] || { echo "::error::public/CNAME must be exactly www.jary8.com, got: $(cat public/CNAME)"; exit 1; }
          cp -f public/CNAME dist/CNAME
          echo "CNAME -> $(cat dist/CNAME)"

      - name: Secret trace scan on build output (gate, backend redline 1/3)
        shell: bash
        run: |
          set -euo pipefail
          # 命中任一特征即失败：Gemini(AIza*)、classic PAT(ghp_*)、fine-grained PAT(github_pat_*)、AWS、私钥块
          PATTERNS='AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -rIqE "$PATTERNS" dist/; then
            echo "::error::secret-like pattern found in dist/ (paths below)"; grep -rIlE "$PATTERNS" dist/; exit 1
          fi
          # M3 起管线唯一写者产出契约文件（mode ∈ ai|rss_only）；seed 占位文件（news.seed.json，契约外）同样扫描
          for f in src/data/news.json src/data/news-stats.json src/data/news.seed.json; do
            if [ -f "$f" ] && grep -qE "$PATTERNS" "$f"; then
              echo "::error::secret-like pattern found in $f"; exit 1
            fi
          done
          echo "secret scan OK"

      - name: Configure Pages
        uses: actions/configure-pages@v5   # v4 会忽略 enablement；v5 支持首部署自动建仓 Pages
        with:
          enablement: automatic

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deploy smoke G6 (test baseline §2.1)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 失败语义：不部署新内容时的回退手段；run 变红即"deploy success ≠ 站点健康"告警（本阶段无独立告警渠道，站主裁定）
      - name: Run G6 live smoke
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/qa-gates.mjs --live "$LIVE_URL"
